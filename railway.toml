[build]
builder = "nixpacks"
buildCommand = "bun install"

[deploy]
startCommand = "bun run server/index.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.deploy]
startCommand = "bun run server/index.ts"
